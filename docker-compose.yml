name: spydf

services:
  spydf:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      # The login, taken from the deployment's own environment (Dokploy's
      # Environment tab, which lands in a .env beside this file) rather than
      # written here: the password has no business in the repository. The
      # defaults keep an empty environment working — no password, no login —
      # which is what a local `docker compose up` wants.
      SPYDF_AUTH_USER: ${SPYDF_AUTH_USER:-admin}
      SPYDF_AUTH_PASSWORD: ${SPYDF_AUTH_PASSWORD:-}   # in clear, or sha256:<hex>
      SPYDF_AUTH_SECRET: ${SPYDF_AUTH_SECRET:-}       # unset: a redeploy signs everyone out
      # every other setting has a default; see .env.example for the full list
      # SPYDF_LOG_LEVEL: INFO
      # SPYDF_LOG_FILE: /var/log/spydf.log
      # SPYDF_LOG_FILENAMES: "1"   # opt-in: log uploaded file names
    ports:
      - "8765:8765"
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
