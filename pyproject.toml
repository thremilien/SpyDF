[project]
name = "spydf"
version = "0.1.0"
description = "Local webapp to redact (truly remove, not just cover) text/regions from PDF exams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
# D1xx: a one-line comment is allowed instead of a docstring on trivial helpers,
# so a missing docstring is not an error here. The rest of D still applies:
# an existing docstring has to follow the Google style.
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# les tests decrivent un scenario, pas une API: leurs docstrings sont libres.
"tests/*" = ["D"]
# B008: `File(...)` en valeur par defaut est la facon dont FastAPI declare un
# envoi de fichier, pas un piege d'argument mutable.
"src/app.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
