<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpyDF — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
<meta name="robots" content="noindex, nofollow">
</head><body class="login-page">

<main class="login-card">
  <div class="login-brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="7.5" y="12.5" width="9" height="4.5" rx="0.5" fill="currentColor"/><line x1="7.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="7.5" y1="9.3" x2="16.5" y2="9.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span class="brand-name">SpyDF</span>
  </div>

  <h1>Sign in</h1>
  <p class="login-sub">This instance is private. The documents you open never leave it.</p>

  {{error}}

  <form class="login-form" method="post" action="/login" autocomplete="on">
    <label class="field">
      <span class="field-label">User</span>
      <input type="text" name="username" id="username" value="{{user}}"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" required>
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" id="password"
             autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn primary login-submit">
      Sign in
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M7.5 4.5L12 9l-4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="3.5" y1="9" x2="11.5" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </form>

  <p class="login-foot">Redaction happens in memory, on this server alone. Nothing is stored between sessions.</p>
</main>

<script>
  // The field to fill is the empty one: a rejected password comes back with the
  // user name already there.
  const u = document.getElementById('username');
  (u.value ? document.getElementById('password') : u).focus();
</script>
</body></html>
